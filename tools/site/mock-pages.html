<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Illustration pages (positions are the extension's own CSS defaults, nothing is hand-placed except the Facebook story button, which the code itself sets inline): stand-ins for Instagram and Facebook with the real Ephemera buttons.
     The buttons use the extension's own class names and stylesheet (dist/content-scripts/instagram.css),
     injected by tools/site/capture-screens.mjs. Placeholder photos only. -->
<style>
  *{box-sizing:border-box} html,body{margin:0}
  body{font:14px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#000;color:#fff}
  .stage{position:relative;overflow:hidden;background:#111}
  .ph{position:absolute;inset:0;background-size:cover;background-position:center}

  /* ---- Instagram story ---- */
  .ig-story{width:420px;height:746px;background:#000}
  .ig-story .bars{position:absolute;left:12px;right:12px;top:10px;display:flex;gap:4px;z-index:3}
  .ig-story .bars i{flex:1;height:2px;border-radius:2px;background:#ffffff59}
  .ig-story .bars i.on{background:#fff}
  .ig-story .who{position:absolute;left:62px;top:22px;display:flex;align-items:center;gap:10px;z-index:3;font-weight:600;font-size:14px;text-shadow:0 1px 3px #000c,0 0 14px #000a}
  .ig-story .who i{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7);border:2px solid #000;display:block}
  .ig-story .who span{font-weight:400;opacity:.8}
  .ig-story .scrim{position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(#0009,transparent);z-index:2}
  .ig-story .reply{position:absolute;left:14px;right:14px;bottom:16px;height:44px;border:1px solid #ffffff99;border-radius:22px;display:flex;align-items:center;padding:0 18px;color:#ffffffcc;z-index:3}

  /* ---- Instagram post ---- */
  .ig-post{width:420px;background:#000}
  .ig-post .head{display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:600}
  .ig-post .head i{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7);display:block}
  .ig-post .head b{margin-left:auto;letter-spacing:2px}
  .ig-post .media{position:relative;width:420px;height:525px;overflow:hidden}
  .ig-post .actions{display:flex;gap:16px;padding:12px 14px;font-size:20px}
  .ig-post .cap{padding:0 14px 16px;color:#e8e8e8}
  .dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:5px;z-index:3}
  .dots i{width:6px;height:6px;border-radius:50%;background:#ffffff80}.dots i.on{background:#fff}
  .count{position:absolute;right:12px;top:12px;background:#000a;border-radius:12px;padding:3px 10px;font-size:12px;z-index:3}

  /* ---- Facebook story ---- */
  .fb-story{width:420px;height:746px;background:#18191a}
  .fb-story .who{position:absolute;left:14px;top:22px;display:flex;align-items:center;gap:10px;z-index:3;font-weight:600;text-shadow:0 1px 3px #000c,0 0 14px #000a}
  .fb-story .who i{width:36px;height:36px;border-radius:50%;background:#1877f2;border:2px solid #fff;display:block}
  .fb-story .bars{position:absolute;left:12px;right:12px;top:8px;display:flex;gap:4px;z-index:3}
  .fb-story .bars i{flex:1;height:3px;border-radius:2px;background:#ffffff59}.fb-story .bars i.on{background:#fff}
  .fb-story .scrim{position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(#0009,transparent);z-index:2}

  /* ---- Facebook feed video ---- */
  .fb-feed{width:520px;background:#242526;border-radius:10px;overflow:hidden}
  .fb-feed .head{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:600}
  .fb-feed .head i{width:36px;height:36px;border-radius:50%;background:#1877f2;display:block}
  .fb-feed .head small{display:block;font-weight:400;color:#b0b3b8}
  .fb-feed .txt{padding:0 16px 12px;color:#e4e6eb}
  .fb-feed .media{position:relative;width:520px;height:292px;overflow:hidden}
  .fb-feed .play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:#0009;display:flex;align-items:center;justify-content:center;z-index:3}
  .fb-feed .play:after{content:"";border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:6px}
  .fb-feed .react{display:flex;gap:18px;padding:12px 16px;color:#b0b3b8;border-top:1px solid #3e4042;margin-top:0}

  /* ---- Instagram profile header ---- */
</style></head><body>

<div id="ig-story" class="stage ig-story">
  <div class="ph" style="background-image:url(__PHOTOS__/p1.jpg)"></div>
  <div class="scrim"></div>
  <div class="bars"><i class="on"></i><i class="on"></i><i></i><i></i></div>
  <div class="who"><i></i>slowroutes <span>2h</span></div>
  <div class="reply">Send message</div>
  <div class="eph_toolkit_dl_btn wfl"><span class="eph_toolkit_dl_pregress_loader"></span><span class="eph_toolkit_icon"></span></div>
</div>

<div id="ig-post" class="stage ig-post">
  <div class="head"><i></i>slowroutes <b>&middot;&middot;&middot;</b></div>
  <div class="media">
    <div class="ph" style="background-image:url(__PHOTOS__/p2.jpg)"></div>
    <div class="count">1/3</div>
    <div class="eph_dowall wfl"><span class="eph_toolkit_dl_pregress_loader"></span><span class="eph_toolkit_icon"></span></div>
    <div class="eph_toolkit_dl_btn wfl"><span class="eph_toolkit_dl_pregress_loader"></span><span class="eph_toolkit_icon"></span></div>
    <div class="dots"><i class="on"></i><i></i><i></i></div>
  </div>
  <div class="actions"><span>&#9825;</span><span>&#9993;</span><span>&#10150;</span></div>
  <div class="cap"><b>slowroutes</b> Three days along the coast, one bag.</div>
</div>

<div id="fb-story" class="stage fb-story">
  <div class="ph" style="background-image:url(__PHOTOS__/p3.jpg)"></div>
  <div class="scrim"></div>
  <div class="bars"><i class="on"></i><i></i><i></i></div>
  <div class="who"><i></i>Slow Routes <span style="font-weight:400;opacity:.8">3h</span></div>
  <div class="eph_toolkit_dl_btn download-btn wfl" style="top:auto;bottom:28px;left:auto;right:12px"><span class="eph_toolkit_dl_pregress_loader"></span><span class="eph_toolkit_icon"></span></div>
</div>

<div id="fb-feed" class="stage fb-feed">
  <div class="head"><i></i><div>Slow Routes<small>Yesterday</small></div></div>
  <div class="txt">Last stop of the trip. The full video goes up next week.</div>
  <div class="media">
    <div class="ph" style="background-image:url(__PHOTOS__/l1.jpg)"></div>
    <div class="play"></div>
    <div class="eph_toolkit_dl_btn wfl"><span class="eph_toolkit_dl_pregress_loader"></span><span class="eph_toolkit_icon"></span></div>
  </div>
  <div class="react"><span>Like</span><span>Comment</span><span>Share</span></div>
</div>


</body></html>
